# Workspace-local cargo aliases (see README § Build, test & lint).

[alias]
# Release + per-test 10s timeout via nextest (.config/nextest.toml).
test-timeout = "nextest run --workspace --release"
# Same, CI profile: run all tests even after failures.
test-timeout-ci = "nextest run --workspace --release --profile ci"
# Clippy -D warnings. Full gate (clippy + substring-golden): `./scripts/ci-clippy.sh`
# (`!sh` aliases need cargo 1.77+; MSRV 1.75 — use the script.)
ci-clippy = "clippy --workspace --all-targets -- -D warnings"
