[workspace]
resolver = "2"
members = [
    "crates/giac-core",
    "crates/giac-poly",
    "crates/giac-linalg",
    "crates/giac-solve",
    "crates/giac-calculus",
    "crates/giac-groebner",
    "crates/giac-simplify",
    "crates/giac-parse",
    "apps/giac-cli",
    "tests/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["Giac Rust port contributors"]

[workspace.dependencies]
num-bigint = "0.4.4"
num-integer = "0.1.45"
num-rational = "0.4.1"
num-traits = "0.2.17"
thiserror = "=1.0.56"
logos = "=0.13.0"
anyhow = "=1.0.75"
giac-core = { path = "crates/giac-core" }
giac-poly = { path = "crates/giac-poly" }
giac-linalg = { path = "crates/giac-linalg" }
giac-solve = { path = "crates/giac-solve" }
giac-calculus = { path = "crates/giac-calculus" }
giac-groebner = { path = "crates/giac-groebner" }
giac-simplify = { path = "crates/giac-simplify" }
giac-parse = { path = "crates/giac-parse" }
nalgebra = "0.33"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
# --- Deny: memory / UB (plan §8) ---
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
mem_forget = "deny"

# --- Warn in source; allow here so `cargo ci-clippy` (-D warnings) stays green
# until call sites adopt `.get()` / checked casts (supplement §6.4) ---
indexing_slicing = "allow"
integer_division = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
float_cmp = "allow"
lossy_float_literal = "allow"
only_used_in_recursion = "allow"
rc_mutex = "allow"
mutex_atomic = "allow"
single_char_pattern = "allow"

# --- Failure modes (supplement §6) ---
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# --- Noise / project-specific ---
arithmetic_side_effects = "allow"
print_stdout = "allow"
print_stderr = "allow"
cognitive_complexity = "allow"
too_many_lines = "allow"
type_complexity = "allow"
needless_borrow = "warn"
needless_range_loop = "allow"

