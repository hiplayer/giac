[workspace]
resolver = "2"
members = [
    "crates/giac-core",
    "crates/giac-simplify",
    "crates/giac-parse",
    "apps/giac-cli",
    "tests/conformance",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
authors = ["Giac Rust port contributors"]

[workspace.dependencies]
num-bigint = "0.4.4"
num-integer = "0.1.45"
num-rational = "0.4.1"
num-traits = "0.2.17"
thiserror = "=1.0.56"
logos = "=0.13.0"
anyhow = "=1.0.75"
giac-core = { path = "crates/giac-core" }
giac-simplify = { path = "crates/giac-simplify" }
giac-parse = { path = "crates/giac-parse" }
